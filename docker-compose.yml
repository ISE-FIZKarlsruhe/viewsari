services:
  viewsari:
    build: .
    volumes:
      - ./data:/app/data
      - ./obliquer/data/viewsari/ground_truth:/app/annotations
      - ./src/evaluation/cq_catalog.json:/app/src/evaluation/cq_catalog.json:ro
    environment:
      - DATA_DIR=/app/data/kg_foundation
      - ANNOTATIONS_DIR=/app/annotations
      - GRAPHDB_URL=http://graphdb:7200
      - GRAPHDB_REPO=viewsari
    depends_on:
      - graphdb
    restart: unless-stopped

  graphdb:
    image: ontotext/graphdb:10.8.4
    volumes:
      - graphdb-data:/opt/graphdb/home
      - ./data/kg:/opt/graphdb/home/graphdb-import
    ports:
      - "7200:7200"
    environment:
      - GDB_HEAP_SIZE=2g
      # Wikidata's WDQS rejects requests with a generic/default User-Agent
      # (phabricator T400119). Federated SERVICE calls are issued by GraphDB's
      # RDF4J HTTP client, which honours the JVM-standard http.agent property.
      - "GDB_JAVA_OPTS=-Dhttp.agent=Viewsari/1.0 (https://viewsari.ise.fiz-karlsruhe.de; sondraszek@gmail.com) GraphDB/10.8.4"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "9000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - viewsari
    restart: unless-stopped

volumes:
  graphdb-data:
