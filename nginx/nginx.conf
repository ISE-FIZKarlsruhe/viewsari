server {
    listen 80;
    server_name viewsari.ise.fiz-karlsruhe.de;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name viewsari.ise.fiz-karlsruhe.de;

    ssl_certificate /etc/letsencrypt/live/viewsari.ise.fiz-karlsruhe.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/viewsari.ise.fiz-karlsruhe.de/privkey.pem;

    location / {
        proxy_pass http://viewsari:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
